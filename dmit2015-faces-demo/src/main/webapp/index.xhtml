<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html">
    <h:head>
        <title>Your Own Custom Title</title>
    </h:head>
    <h:body>
        <h:form>
            <h:messages />

            <h:inputText
                value="#{greetingBean.firstName}"
                placeholder="Enter your first name" />

            <h:commandButton
                value="Submit" />

            <br/>
            <br/>

            <h:outputText
                value="#{greetingBean.greetingMessage}"/>

        </h:form>
    </h:body>
</html>
